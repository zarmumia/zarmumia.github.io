.intro h1{font-weight:800;letter-spacing:-.03em;line-height:1;font-size:clamp(40px,7vw,68px);color:var(--teal-d);margin-bottom:16px}
.intro h1 em{font-style:normal;color:var(--amber)}
.intro p{color:var(--mute);font-size:20px;max-width:560px;margin-bottom:22px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.facts span{background:var(--teal-t);color:var(--teal-d);font-weight:700;font-size:15px;border-radius:999px;padding:6px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:#fff;text-decoration:none;font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 26px;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #B2661C;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 2px 0 #B2661C}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #B2661C}
.btn.line{background:transparent;color:var(--teal);border:2px solid var(--teal);box-shadow:none}
.btn.wa{background:#1FAF55;box-shadow:0 4px 0 #168540}
/* quiz */
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 24px 50px -30px rgba(8,66,63,.35)}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:22px;font-size:15px;color:var(--mute);font-weight:700}
.bar{flex:1;height:8px;border-radius:8px;background:var(--teal-t);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:8px;transition:width .35s}
.q h2{font-size:clamp(24px,3.6vw,32px);line-height:1.2;font-weight:800;color:var(--teal-d);margin-bottom:6px;letter-spacing:-.01em}
.q .hint{color:var(--mute);font-size:16px;margin-bottom:18px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;font-size:18px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-m)}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #B8C4C2;display:flex;align-items:center;justify-content:center}
.opt.multi .mk{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--teal-t)}
.opt[aria-checked="true"] .mk{border-color:var(--teal);background:var(--teal)}
.opt[aria-checked="true"] .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.multi[aria-checked="true"] .mk::after{width:10px;height:6px;border-radius:0;background:none;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.linkbtn{background:none;border:0;font:inherit;color:var(--mute);cursor:pointer;font-size:16px;text-decoration:underline}
.privacy{margin-top:18px;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
.privacy svg{flex:none}
/* result */
.res-head{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-bottom:28px}
.gauge{position:relative;width:150px;height:150px}
.gauge svg{width:150px;height:150px;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--teal-d);line-height:1}
.gauge b small{font-size:13px;color:var(--mute);font-weight:700;margin-top:4px}
.res-head h2{font-size:clamp(28px,4.4vw,40px);line-height:1.1;font-weight:800;color:var(--teal-d);letter-spacing:-.02em}
.res-head p{color:var(--mute);margin-top:6px}
.ins{display:grid;gap:14px;margin-bottom:26px}
.in{border:1px solid var(--line);border-radius:20px;padding:20px 22px;background:#fff;border-right:6px solid var(--amber)}
.in .k{font-size:14px;font-weight:800;color:var(--amber)}
.in h3{font-size:22px;font-weight:800;color:var(--teal-d);margin:2px 0 6px;line-height:1.25}
.in p{color:var(--ink);font-size:17px}
.in .fix{margin-top:10px;background:var(--teal-t);border-radius:12px;padding:10px 14px;font-size:16.5px}
.in .fix b{color:var(--teal-d)}
.first{border-radius:22px;padding:24px;color:#fff;position:relative;overflow:hidden;margin-bottom:26px}
.first .veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(8,66,63,.95),rgba(8,66,63,.75))}
.first>div{position:relative}
.first .k{color:var(--amber-l);font-weight:800;font-size:15px}
.first h3{font-size:26px;font-weight:800;line-height:1.2;margin:4px 0 8px}
.first p{color:#D6E8E5}
.ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--mute);margin-top:14px}
.gk{width:110px;display:block}
.gk .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:600px){.card{padding:22px 18px;border-radius:20px}.res-head{grid-template-columns:1fr;justify-items:start}.gauge,.gauge svg{width:120px;height:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header>
  <a class="brand" href="./"><img src="assets/gecko_teal.png" alt="">זרמומיה</a>
  <a class="back" href="./">→ לאתר</a>
</header>
<div class="band tile" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>

<script>
const WA = "972547892320";
const Q = [
  {id:"type", q:"איזה עסק יש לכם?", opts:["משרד שירות מקצועי (רו״ח, החזרי מס, ביטוח וכו׳)","קליניקה או מטפל/ת","נותני שירות בשטח","חנות או מסחר","אחר"]},
  {id:"team", q:"כמה אנשים מטפלים בלקוחות?", opts:["רק אני","2–5","6–15","יותר מ־15"]},
  {id:"leads", q:"כמה פניות חדשות מגיעות בחודש?", hint:"הערכה גסה מספיקה", opts:["פחות מ־20","20–100","100–300","יותר מ־300"]},
  {id:"channels", q:"איפה הפניות נוחתות?", hint:"אפשר לסמן כמה", multi:true, opts:["וואטסאפ","טלפון","מייל","טופס באתר","מערכת CRM"]},
  {id:"speed", q:"תוך כמה זמן חוזרים לפנייה חדשה?", opts:["תוך שעה","באותו יום","יום–יומיים","תלוי מי ומתי","לא בטוחים"]},
  {id:"next", q:"איך יודעים מה הצעד הבא עם כל לקוח?", opts:["מערכת שמתעדכנת","אקסל או גיליון","זוכרים בראש","אין באמת שיטה"]},
  {id:"status", q:"כמה פעמים בשבוע לקוחות מתקשרים לשאול \"מה קורה?\"", opts:["כמעט אף פעם","כמה פעמים","הרבה","לא יודעים"]},
  {id:"numbers", q:"יש לכם תמונת מצב במספרים?", hint:"כמה פניות, כמה נסגרו, איפה נתקע", opts:["דשבורד שמתעדכן","דוחות ידניים מדי פעם","תחושת בטן"]},
  {id:"pain", q:"מה הכי כואב היום?", opts:["לידים שנעלמים בדרך","עבודה ידנית שגוזלת זמן","אין לי שליטה ותמונת מצב","לקוחות לא מעודכנים","הכול עובר דרכי"]},
];
const A = {}; let step = -1;
const app = document.getElementById("app");
const lock = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E6B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function intro(){
  app.innerHTML = `<section class="intro fade"><div>
    <h1>איפה הלידים <em>נופלים</em> אצלכם?</h1>
    <p>9 שאלות קצרות על איך העסק עובד היום – ובסוף תובנות ראשונות מיד על המסך: איפה כנראה הולכים לאיבוד לקוחות וזמן, ומה הצעד הראשון.</p>
    <div class="facts"><span>2 דקות</span><span>בלי הרשמה</span><span>התשובות לא נשמרות</span></div>
    <button class="btn" id="go">מתחילים ←</button>
    </div>${GECKO}
  </section>`;
  document.getElementById("go").onclick = () => { step = 0; if(typeof gtag==="function")gtag("event","check_start"); render(); };
}

function render(){
  if (step < 0) return intro();
  if (step >= Q.length) return result();
  const q = Q[step], sel = A[q.id] || (q.multi ? [] : null);
  const pct = Math.round(step / Q.length * 100);
  app.innerHTML = `<section class="card fade">
    <div class="prog"><span>שאלה ${step+1} מתוך ${Q.length}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="q"><h2 id="qh">${q.q}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:""}
      <div class="opts" role="${q.multi?"group":"radiogroup"}" aria-labelledby="qh">
        ${q.opts.map((o,i)=>`<button type="button" class="opt${q.multi?" multi":""}" role="${q.multi?"checkbox":"radio"}" aria-checked="${q.multi?sel.includes(i):sel===i}" data-i="${i}"><span class="mk"></span>${o}</button>`).join("")}
      </div></div>
    <div class="nav">
      ${step>0?`<button class="linkbtn" id="prev">→ הקודמת</button>`:"<span></span>"}
      ${q.multi?`<button class="btn" id="next" ${sel.length?"":"disabled"}>${step===Q.length-1?"לתוצאות":"הבאה ←"}</button>`:""}
    </div>
    <p class="privacy">${lock} התשובות נשארות אצלכם בדפדפן ולא נשמרות אצלנו.</p>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (q.multi){
      const s = new Set(A[q.id] || []); s.has(i) ? s.delete(i) : s.add(i); A[q.id] = [...s].sort();
      b.setAttribute("aria-checked", s.has(i)); document.getElementById("next").disabled = !s.size;
    } else {
      A[q.id] = i; app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", x === b));
      setTimeout(() => { step++; render(); }, 220);
    }
  });
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => { step++; render(); };
  const pv = document.getElementById("prev"); if (pv) pv.onclick = () => { step--; render(); };
  const first = app.querySelector('.opt[aria-checked="true"]') || app.querySelector(".opt"); first && first.focus({preventScroll:true});
}

/* ---------- rules: answers → insights (each pairs the problem with a fix) ---------- */
function analyse(){
  const t = (id) => Q.find(q=>q.id===id).opts[A[id]];
  const ch = (A.channels||[]).map(i=>Q[3].opts[i]);
  const bigVolume = A.leads >= 1;          // 20+ a month
  const issues = [];
  const add = (key, sev, data) => sev > 0 && issues.push({key, sev, ...data});
  const painKey = ["leads","manual","visibility","status","owner"][A.pain];

  add("leads", (A.speed>=2 ? 3 : A.speed===1 ? 1 : 0) + (bigVolume && A.speed>=1 ? 1 : 0), {
    k:"מענה ראשון", h:"הלידים מתקררים לפני שמישהו חוזר אליהם",
    p:`עניתם: "${t("speed")}". מי שמשאיר פרטים פונה בדרך כלל לעוד כמה עסקים – ומי שחוזר ראשון, לרוב זוכה.`,
    f:"תזכורת אוטומטית לכל פנייה חדשה, והתראה כשפנייה לא נענתה תוך שעה."});
  const scattered = ch.length >= 3 || (ch.length >= 2 && !ch.includes("מערכת CRM"));
  add("scatter", scattered ? (ch.includes("מערכת CRM") ? 1 : 2) : 0, {
    k:"ערוצים", h:"הפניות מפוזרות בין כמה ערוצים",
    p:`פניות מגיעות דרך ${ch.join(", ")}. כל ערוץ הוא עוד מקום שבו פנייה יכולה להישכח.`,
    f:"איסוף אוטומטי של כל הפניות למקום אחד, עם שיוך לאחראי ותזכורת."});
  add("memory", A.next>=2 ? 3 : A.next===1 ? 1 : 0, {
    k:"מעקב", h:"הצעד הבא נמצא בראש של מישהו",
    p:`עניתם: "${t("next")}". כשמישהו חולה, עסוק או עוזב – גם המידע הולך איתו.`,
    f:"תיעוד אוטומטי אחרי כל שיחה: סיכום ב־AI ומועד לחזרה, ישר לכרטיס הלקוח."});
  add("status", A.status===2 ? 3 : (A.status===1 || A.status===3) ? 1 : 0, {
    k:"עדכון לקוחות", h:"לקוחות מתקשרים כדי לשאול מה קורה",
    p:"כל שיחת \"מה קורה?\" גוזלת זמן מהצוות – ואומרת שהלקוח מרגיש שלא מעדכנים אותו.",
    f:"עדכוני סטטוס אוטומטיים בכל שלב, בוואטסאפ או במייל."});
  add("visibility", A.numbers===2 ? 3 : A.numbers===1 ? 1 : 0, {
    k:"תמונת מצב", h:"אין תמונת מצב במספרים",
    p:"בלי מספרים קשה לדעת איפה נתקע ובמה להשקיע קודם – ההחלטות נעשות לפי תחושה.",
    f:"דשבורד אחד שמתעדכן לבד: כמה פניות, כמה נענו, איפה נתקע וכמה כסף בדרך."});
  add("owner", A.pain===4 ? 2 : 0, {
    k:"ניהול", h:"הכול עובר דרככם",
    p:"כשכל החלטה קטנה מגיעה לבעלים, העסק לא יכול לגדול מעבר לשעות שלכם.",
    f:"מפת החלטות: מה הצוות מחליט לבד, ודיווח יומי אחד במקום עשרות הודעות."});
  add("manual", A.pain===1 ? 2 : 0, {
    k:"עבודה ידנית", h:"עבודה ידנית שחוזרת על עצמה",
    p:"תזכורות, מסמכים והודעות שחוזרות על עצמן – זה בדיוק מה שאפשר להעביר למכונה.",
    f:"אוטומציה למשימות החוזרות, על הכלים שכבר יש לכם."});
  issues.forEach(i => { if (i.key === painKey) i.sev += 2; });
  issues.sort((a,b)=>b.sev-a.sev);
  const total = issues.reduce((s,i)=>s+i.sev,0);
  const score = Math.max(18, Math.min(96, 100 - total*6));
  return {issues: issues.slice(0,3), score};

function result(){
  if(typeof gtag==="function")gtag("event","check_complete");
  const {issues, score} = analyse();
  const r = 54, c = 2*Math.PI*r;
  const head = score >= 75 ? "העסק זורם יפה" : score >= 50 ? "יש כמה צווארי בקבוק" : "כאן הולך לאיבוד כסף";
  const sub = score >= 75 ? "הבסיס טוב. נשאר לחדד כמה נקודות." : "החדשות הטובות: אלה בדיוק הדברים שאפשר לתקן מהר, עם הכלים שכבר יש לכם.";
  const top = issues[0];
  const summary = [`ציון זרימה: ${score}/100`, ...issues.map(i=>`• ${i.h}`)].join("\n");
  const waText = encodeURIComponent(`היי פאני, עשיתי את הבדיקה המהירה באתר.\n${summary}\nאשמח לשיחה קצרה.`);
  app.innerHTML = `<section class="fade">
    <div class="res-head">
      <div class="gauge" role="img" aria-label="ציון זרימה ${score} מתוך 100">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#DCEBE7" stroke-width="12"/>
        <circle cx="60" cy="60" r="${r}" fill="none" stroke="${score>=75?"#14857F":"#D9822B"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-score/100)}"/></svg>
        <b>${score}<small>ציון זרימה</small></b>
      </div>
      <div><h2>${head}</h2><p>${sub}</p></div>
    </div>
    ${issues.length ? `<div class="ins">${issues.map((i,n)=>`<article class="in"><span class="k">תובנה ${n+1} · ${i.k}</span><h3>${i.h}</h3><p>${i.p}</p><p class="fix"><b>מה אפשר לעשות:</b> ${i.f}</p></article>`).join("")}</div>`
      : `<div class="ins"><article class="in"><span class="k">תובנה</span><h3>נשמע שהעסק מתוקתק</h3><p>המענה מהיר, יש מעקב ויש מספרים. השלב הבא הוא בדרך כלל לחסוך עוד זמן לצוות.</p><p class="fix"><b>מה אפשר לעשות:</b> עוזרי AI לעבודה החוזרת – סיכומי שיחה, סינון פניות וסיכום בוקר.</p></article></div>`}
    <div class="first tile"><div class="veil"></div><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      ${GECKO}
      <div style="flex:1;min-width:220px"><span class="k">הצעד הראשון המומלץ</span>
      <h3>${top ? top.f : "שיחה קצרה כדי למצוא את הדבר הבא שכדאי לתקן."}</h3>
      <p>בשיחת היכרות קצרה נבין איך זה עובד אצלכם בפועל, ונגיד בכנות אם ואיך אפשר לעזור.</p></div></div></div>
    <div class="ctas">
      <a class="btn wa" href="https://wa.me/${WA}?text=${waText}" target="_blank" rel="noopener">לשלוח לי את התוצאות בוואטסאפ ולדבר</a>
      <button class="btn line" id="again">לעשות שוב</button>
    </div>
    <p class="note">${lock.replace('width="16"','width="14"').replace('height="16"','height="14"')} התוצאות נשלחות רק אם תלחצו על הכפתור, ורק דרך הוואטסאפ שלכם. אלה תובנות ראשוניות לפי התשובות – לא אבחון מלא.</p>
  </section>`;
  document.getElementById("again").onclick = () => { for (const k in A) delete A[k]; step = -1; render(); window.scrollTo(0,0); };
  window.scrollTo({top:0});
}
render();
</script>
