/* פריסה: חנות-גלריה, קיר טיח בהיר, תמונות ממוסגרות כמו בבית, טקסט מימין */
:root{
  --paper:#FBF7F0; --wall:#E6F2F1; --ink:#0A2A4D; --ink-soft:#3D5672;
  --sand:#C85A12; --line:rgba(10,42,77,.15); --card:#FFFFFF; --accent:#2C5DB0;
  --ok:#2E7D4F; --teal:#17B0AB; --magenta:#A51A78;
  --display:'Keter YG','Arial Hebrew',Arial,sans-serif;
  --body:'Assistant','Arial Hebrew',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1A3A; --wall:#102654; --ink:#F3F7F8; --ink-soft:#B3C3E6; --sand:#F5A25E;
  --line:rgba(243,247,248,.15); --card:#13295A; --accent:#7FA2EC; --ok:#7FCB98; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1A3A; --wall:#102654; --ink:#F3F7F8; --ink-soft:#B3C3E6; --sand:#F5A25E;
  --line:rgba(243,247,248,.15); --card:#13295A; --accent:#7FA2EC; --ok:#7FCB98; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;font-synthesis:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}

/* כותרת */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-family:var(--display);font-size:26px;text-decoration:none;letter-spacing:.3px;display:flex;align-items:center;gap:12px;line-height:1.1;color:var(--ink)}
.brand img{width:54px;height:54px;display:block;flex:none}
.brand span{display:flex;flex-direction:column}

.brand small{font-family:var(--body);font-size:13px;letter-spacing:.4px;color:var(--ink-soft);margin-top:3px}
nav{display:flex;gap:22px;align-items:center;font-size:16px}
nav a{text-decoration:none;color:var(--ink-soft)}
nav a:hover{color:var(--ink)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:none;padding:6px 14px;border-radius:999px;font-size:15px}
.cartbtn b{font-variant-numeric:tabular-nums;font-weight:600}

/* פתיח */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:48px 56px}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:1.08}
.hero p{color:var(--ink-soft);max-width:30em;margin:18px 0 26px;font-size:18px}
.hero img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:12px 26px;border-radius:2px;border:0;font-size:16px;letter-spacing:.3px}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
:root[data-theme="dark"] .cta:not(.ghost){color:var(--paper)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta:not(.ghost){color:var(--paper)}}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:30px;font-size:14px;color:var(--ink-soft)}
.facts span::before{content:"·";margin-left:8px;color:var(--sand)}


/* פתיח נעביבשק */
.bhero{position:relative;background:#2C5DB0 url(img/hero.jpg) center 84%/cover no-repeat;min-height:min(78vh,640px);display:flex;align-items:center;padding:clamp(28px,6vw,72px) 16px}
.bhero .card{width:100%;max-width:540px;margin:0;margin-inline-start:max(0px,calc((100% - 1180px)/2));background:var(--paper);border:3px solid var(--accent);outline:6px solid var(--paper);border-radius:18px;padding:clamp(24px,4vw,44px) clamp(20px,4vw,48px);display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,36px);align-items:center;box-shadow:0 18px 40px rgba(6,30,56,.35)}
.bhero img{width:clamp(96px,11vw,130px);height:auto;display:block}
.bhero h1{font-size:clamp(44px,5.5vw,68px);line-height:1;color:var(--ink)}
.bhero .tag{font-family:var(--display);font-size:clamp(20px,2.6vw,28px);color:var(--accent);margin:6px 0 14px}
.bhero p{margin:0 0 22px;color:var(--ink-soft);max-width:28em}
.bhero .btns{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:620px){.bhero .card{grid-template-columns:1fr;text-align:center;justify-items:center}.bhero .btns{justify-content:center}}

.banner{width:100%;aspect-ratio:16/5;object-fit:cover;display:block;margin-bottom:28px;border-radius:4px}
@media (max-width:620px){.banner{aspect-ratio:16/8}}
/* מבצע */
.deal{background:var(--wall);border-block:1px solid var(--line)}

const PRIM={y:{n:'צהוב',c:'#CD9626'},b:{n:'כחול',c:'#26468A'},r:{n:'אדום',c:'#942630'}};
const MIX={yb:{n:'ירוק',c:'#3A7046'},yr:{n:'כתום',c:'#CC6828'},br:{n:'סגול',c:'#60326A'}};
const mixOf=(a,b)=>a===b?PRIM[a]:MIX[[a,b].sort((x,y)=>'ybr'.indexOf(x)-'ybr'.indexOf(y)).join('')];
const SIZES={a:{n:'13×18 · אמצע 15×21',side:[130,180],mid:[150,210]},b:{n:'15×21 · אמצע 20×30',side:[150,210],mid:[200,300]},sq:{n:'מסגרות לבנות 20×20',side:[170,170],mid:[170,170]}};

function framedTotal(n){const t=Math.floor(n/3),r=n%3;return t*TRIPLE+(r===2?PAIR:r*PRICE_FRAMED)}
function totals(){
  const nF=cart.filter(x=>x.kind==='framed').reduce((a,b)=>a+b.q,0);
  const nP=cart.filter(x=>x.kind==='poster').reduce((a,b)=>a+b.q,0);
  const sets=cart.filter(x=>x.kind==='set'||x.kind==='trip'), setSum=sets.reduce((a,b)=>a+(b.kind==='trip'?TRIPLE:SET_PRICE[b.size])*b.q,0);
  const nX=cart.filter(x=>x.kind==='test').reduce((a,b)=>a+b.q,0)*5; // מוצר בדיקה נסתר, #test
  const full=nF*PRICE_FRAMED+nP*POSTER+setSum+nX, fr=framedTotal(nF);
  const ship=(nF===1&&!sets.length)?SHIP:0, sub=fr+nP*POSTER+setSum+nX; // משלוח חינם מ־2 תמונות או בסט
  const save=nF*PRICE_FRAMED-fr, saved=save+((!ship&&(nF>1||sets.length))?SHIP:0);
  return {nF,nP,full,save,saved,sub,ship,total:sub+ship};
}

const YOMTOV=new Set(['2027-04-22','2027-04-28','2027-06-11','2027-10-02','2027-10-03','2027-10-11','2027-10-16','2027-10-23','2028-04-11','2028-04-17','2028-05-31','2028-09-21','2028-09-22','2028-09-30','2028-10-05','2028-10-12','2029-03-31','2029-04-06','2029-05-20','2029-09-10','2029-09-11','2029-09-19','2029-09-24','2029-10-01','2030-04-18','2030-04-24','2030-06-07','2030-09-28','2030-09-29','2030-10-07','2030-10-12','2030-10-19','2031-04-08','2031-04-14','2031-05-28']);
function isShabbat(){
  const fmt=(d,o)=>Object.fromEntries(new Intl.DateTimeFormat('en-CA',Object.assign({timeZone:'Asia/Jerusalem'},o)).formatToParts(d).map(x=>[x.type,x.value]));
  const now=new Date(), p=fmt(now,{weekday:'short',hour:'numeric',hour12:false,year:'numeric',month:'2-digit',day:'2-digit'});
  const h=+p.hour%24, today=`${p.year}-${p.month}-${p.day}`;
  const t=fmt(new Date(now.getTime()+864e5),{year:'numeric',month:'2-digit',day:'2-digit'}), tomorrow=`${t.year}-${t.month}-${t.day}`;
  const holy=d=>YOMTOV.has(d), wd=p.weekday;
  return ((wd==='Sat'||holy(today))&&h<21) || ((wd==='Fri'||holy(tomorrow))&&h>=14) || (wd==='Sat'&&holy(tomorrow)) || (holy(today)&&(wd==='Fri'||holy(tomorrow)));
}

const PB='https://www.paperless.tax/invoice?sID=3wR0dOAkWQg6lDf1w-95K';
const PAYLINKS={5:PB+'W9TybJKAzqSdysLLeWGFlQmJ2RISmykMA', /* בדיקה זמנית */ 189:PB+'RWRxP7Vjt7RnkPKu5L0cISoEtLkn2DkvA',289:PB+'TCfD9kwUJMnMvjmjm-kq2JlfGCX76bmnQ',399:PB+'XE7R6WUx9eMMJN0TEHzitHEvVV-7L7_lw',

function itemLine(x){
  if(x.kind==='test')return 'מוצר בדיקה ₪5';
  if(x.kind==='trip')return `טריפטיך אעופה · הילד · שמח בני · כמות ${x.q}`;
  if(x.kind==='set')return `צבע + צבע: ${WORDS[x.w1].w} (${PRIM[x.c1].n}) · קיבוץ גלויות · ${WORDS[x.w2].w} (${PRIM[x.c2].n}) · ${SIZES[x.size].n} · כמות ${x.q}`;
  const p=P.find(y=>y.id===x.id);
  return `${p.plain} · ${x.kind==='framed'?'ממוסגר, מסגרת '+COLORS.find(c=>c.id===x.color).name:'פוסטר להדפסה (קובץ)'} · כמות ${x.q}`;
}
const WORKER='https://mm-pay.fanny-ra.workers.dev';  // כתובת ה-Worker ב-Cloudflare, למשל https://mm-pay.xxx.workers.dev
function payModal(no,url,note){
  const d=document.createElement('div');d.className='paymodal';d.setAttribute('role','dialog');d.setAttribute('aria-label','תשלום מאובטח');
  d.innerHTML=`<div class="pm"><div class="pmh"><span>הזמנה ${no}${note?' · כתבי את המספר ב"הערה למוכר"':' · תשלום מאובטח'}</span><button type="button" aria-label="סגירה">✕</button></div><iframe src="${url}" title="תשלום מאובטח" allow="payment"></iframe></div>`;
  d.querySelector('button').onclick=()=>d.remove(); document.body.appendChild(d);
}
function showPay(f,m,no,url,note){
  f.querySelectorAll('.f,.two,button[type=submit]').forEach(e=>e.hidden=true);
  const cp=()=>{try{navigator.clipboard.writeText(no).catch(()=>{})}catch(e){}};
  m.innerHTML=`<b>ההזמנה ${no} נשמרה.</b> נשאר רק לשלם, כאן למטה.${note?` בשדה "הערה למוכר" כתבי <b>${no}</b> <button type="button" class="rm" id="cpno">העתקה</button>`:''}
    <iframe class="payframe" src="${url}" title="תשלום מאובטח" allow="payment"></iframe>`;
  if(note)document.getElementById('cpno').onclick=cp;
  m.scrollIntoView({behavior:'smooth',block:'start'});
}
function sendOrder(f,m){
  const t=totals(), v=id=>{const e=f.querySelector('#'+id);return e?e.value.trim():''};
  const d=new Date(), no=`${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(100+Math.random()*900)}`;
  const btn=f.querySelector('button[type=submit]'); btn.disabled=true; m.textContent='שולחים את ההזמנה...';
  const addr=[v('st'),v('ct')].filter(Boolean).join(', ');
  const isGift=!!(f.querySelector('#gf')&&f.querySelector('#gf').checked);
  const body={_subject:`ליד · הזמנה ${no} · ${nis(t.total)} · עוד לא שולם`,'סטטוס':'לקוחה פתחה הזמנה. כשהתשלום יעבור יגיע מייל "שולם". אם לא ישולם תוך 30 דקות יגיע מייל "לא שולם".',_template:'table',_captcha:'false',
    'מספר הזמנה':no,'שם':v('fn'),'טלפון':v('ph'),'מייל':v('em'),'כתובת':addr||'—',
    'מתנה':isGift?`כן · למקבל/ת: ${v('gn')} · ${v('gp')}`:'לא','ברכה לכרטיס':isGift?(v('gb')||'—'):'—',
    'הערות':v('nt')||'—','פריטים':cart.map(itemLine).join(' | '),'משלוח':t.ship?nis(t.ship):'חינם','לתשלום':nis(t.total)};
  try{localStorage.setItem('mm-last',no)}catch(e){}
  const tfetch=(u,o,ms)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o)).finally(()=>clearTimeout(t))};
  const mail=tfetch(ORDER_TO,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},9000).then(r=>r.ok?r.json():{}).then(j=>!!j.ok).catch(()=>false);
  // 1) תשלום לסכום המדויק דרך ה-Worker (פייפרלס API)
  const viaWorker=!WORKER?Promise.resolve(null):tfetch(WORKER+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({no,cart:cart.map(x=>({kind:x.kind,q:x.q,size:x.size||null})),buyer:{name:v('fn'),email:v('em'),phone:v('ph'),address:addr},gift:isGift?{name:v('gn'),phone:v('gp'),blessing:v('gb')}:null,
        remark:`הזמנה ${no}: ${cart.map(itemLine).join(' | ')}${isGift?' | מתנה ל'+v('gn'):''}${v('nt')?' | הערות: '+v('nt'):''}`.slice(0,480),total:t.total})},12000)
    .then(r=>r.ok?r.json():null).then(j=>{if(!(j&&j.url&&j.amount===t.total))return null;const u=new URL(j.url);if(v('ph'))u.searchParams.set('phone',v('ph').replace(/[^\d+]/g,''));return u.toString()}).catch(()=>null);
  // התשלום לא מחכה למייל: אם יש קישור, פותחים מיד
  viaWorker.then(url=>url?{url}:mail.then(sent=>({sent}))).then(({url,sent})=>{
    if(url)return showPay(f,m,no,url,false);
    // 2) גיבוי: עמודי מכירה קבועים לפי סכום
    const q=k=>cart.filter(x=>x.kind===k).reduce((s,x)=>s+x.q,0), nF=q('framed'),nP=q('poster'),nS=q('set'),nT=q('trip'),nX=q('test');
    const ok=(nX===1&&cart.length===1)||(!nX&&nF>=1&&nF<=3&&!nP&&!nS&&!nT)||(nT===1&&!nF&&!nP&&!nS)||(nP===1&&!nF&&!nS&&!nT)||(nS===1&&!nF&&!nP&&!nT);
    const link=ok?PAYLINKS[t.total]:null;
    if(link)return showPay(f,m,no,link,true);
    // 3) גיבוי אחרון: הזמנה במייל וקישור ידני
    if(!sent){btn.disabled=false;m.textContent='משהו לא עבד בשליחה. נסי שוב בעוד רגע.';return}
    cart.length=0;save();
    m.textContent=`תודה! ההזמנה ${no} התקבלה. קישור לתשלום מאובטח יישלח אלייך תוך כמה שעות.`;
  });
}

  if(window.top!==window){try{window.top.location.hash='thanks';return}catch(e){}}

  V.innerHTML=`<section class="wrap sec legal"><h2>תודה!</h2><p>התשלום התקבל${no?` עבור הזמנה ${no}`:''}. קבלה נשלחה אלייך למייל.</p><p>ההדפסים מודפסים וממוסגרים במיוחד בשבילך, ויגיעו עד 5 ימי עסקים.</p><p><a href="#shop">חזרה לחנות</a></p></section>`;
}
function route(){
  const h=location.hash.slice(1);
  const p=P.find(x=>x.id===h);
  if(p)product(p);else if(h==='trip')tripView();else if(h==='set')setView();else if(h==='cart')cartView();else if(h==='about')about();else if(LEGAL[h])legal(h);else if(h==='thanks')thanks();else if(h==='test'){cart.length=0;cart.push({key:'test',kind:'test',q:1});save();location.hash='cart';return}else{shop();if(h==='prints'||h==='moroccan')document.getElementById(h).scrollIntoView()}
  if(!(h==='prints'||h==='moroccan'))window.scrollTo(0,0);
}
